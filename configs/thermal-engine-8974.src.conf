# Thermal-engine configuration of the Lumia 1520 (bandit), for the MSM8974
# thermal-engine blob of msm8974-common (TheMuppets, oppo).
#
# THE BLOB READS ONLY THE FIRST 5120 BYTES OF ITS CONFIGURATION FILE. This
# file, with its comments, is the source: gen-thermal-conf.sh writes
# thermal-engine-8974.conf from it without comments and fails above that
# size (on the Lumia 930 a longer file lost every rule after the first
# nine without a word in the log).
#
# The msm8974-common (OnePlus One) file with the CPU rules of the Lumia 930,
# which has the same blob and the same camera stack. The blob's own rules
# for the cores and the PoP memory (SS-CPU0..3, SS-POPMEM) use the ss
# algorithm: one frequency step down per sample while the sensor is above
# the set point, with no lower bound, so they end at 300 MHz. With the
# camera on most of the heat is not the CPU's (on the 930 the whole die rose
# alike at 690 or 1660 MHz), the temperature does not come down and ss
# always reaches the bottom. Below 960 MHz the camera pipeline cannot keep
# up: the VFE drops statistics, the AEC gets its luma late and the exposure
# swings between bright and dark (930, 25/11/2026: steps of light settle in
# 0.4 s at 960 and 1190 MHz, 1080p60 never settles at 729 MHz).
#
# The blob has no keyword to stop ss at a frequency, so those rules are
# disabled ("disable 1": the log says it ignores the 1, without it the
# section stays) and replaced by monitors with fixed steps. 1190 MHz is the
# floor up to 97 C (the LG G2 and G3 and the LineageOS Nexus 5 never go
# lower); the two steps below it are a last resort. The cores start at
# 85 C as on the LG G2 and G3 (the blob default is 90 C, the OnePlus value
# was 75 C), the PoP memory at the 80 C of the blob. A new section must
# start with algo_type, or the blob drops it. Not tried on a 1520.

sampling         5000

[SS-CPU0]
disable          1

[SS-CPU1]
disable          1

[SS-CPU2]
disable          1

[SS-CPU3]
disable          1

[CPU0-STEP]
algo_type        monitor
sensor           cpu0
sampling         250
thresholds       85000 88000 91000 97000 101000
thresholds_clr   80000 85000 88000 93000 97000
actions          cpu cpu cpu cpu cpu
action_info      1728000 1497600 1190400 729600 300000

[CPU1-STEP]
algo_type        monitor
sensor           cpu1
sampling         250
thresholds       85000 88000 91000 97000 101000
thresholds_clr   80000 85000 88000 93000 97000
actions          cpu cpu cpu cpu cpu
action_info      1728000 1497600 1190400 729600 300000

[CPU2-STEP]
algo_type        monitor
sensor           cpu2
sampling         250
thresholds       85000 88000 91000 97000 101000
thresholds_clr   80000 85000 88000 93000 97000
actions          cpu cpu cpu cpu cpu
action_info      1728000 1497600 1190400 729600 300000

[CPU3-STEP]
algo_type        monitor
sensor           cpu3
sampling         250
thresholds       85000 88000 91000 97000 101000
thresholds_clr   80000 85000 88000 93000 97000
actions          cpu cpu cpu cpu cpu
action_info      1728000 1497600 1190400 729600 300000

# GPU, tsens 10. The OnePlus file had algo_type commented out here, as in the
# sections that override a default of the blob; SS-GPU is not one of them, so
# the blob dropped it and the rule never ran. Same rule as on the 930.

[SS-GPU]
algo_type        ss
sampling         250
sensor           tsens_tz_sensor10
device           gpu
set_point        85000
set_point_clr    55000
override         15000

[SS-POPMEM]
disable          1

[POPMEM-STEP]
algo_type        monitor
sensor           pop_mem
sampling         250
thresholds       80000 83000 86000 89000 97000 101000
thresholds_clr   75000 80000 83000 86000 93000 97000
actions          cpu cpu cpu cpu cpu cpu
action_info      1728000 1497600 1267200 1190400 729600 300000

[GPU_MONITOR]
algo_type        monitor
sensor           tsens_tz_sensor10
sampling         1000
thresholds       75000
thresholds_clr   55000
actions          battery
action_info      1

# Skin: the SYS_THERM2 thermistor, read as pa_therm1. This needs the kernel
# that gives that name to its ADC_TM zone (branch bandit-thermal-adc; the
# blob reads ADC thermistors only as pa_therm0 and pa_therm1). With an older
# kernel pa_therm1 is PA_THERM1, which reads -40 C on the 1520: these rules
# then never act.
#
# Thresholds from the stock Windows Phone DSDT, which runs six passive zones
# on it: TZ37 53 C display (critical 70 C), TZ38 56 C display and charger,
# TZ39 59 C PEP, TZ40 59 C CPUs, TZ41 62 C camera, TZ42 62 C every device.
# They are 7-8 C above the zones of the Lumia 930 (46-54 C, critical 56 C).
# Each zone is a fixed limit here; the PEP zone has no equivalent.
#
# Display: half brightness (the lcd action caps
# /sys/class/leds/lcd-backlight/max_brightness, 0-255).

[SKIN-LCD]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       53000
thresholds_clr   51000
actions          lcd
action_info      127

# Charging: battery levels of qcom,thermal-mitigation <1500 700 600 325>,
# 2 = 600 mA, 3 = 325 mA.

[SKIN-CHARGE]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       56000 62000
thresholds_clr   54000 60000
actions          battery battery
action_info      2 3

# CPU: Windows comes down from 59 C with the ACPI passive formula, a step at
# a time, and throttles every device at 62 C. Steps down to the 1190 MHz
# floor of the die rules, then the shutdown at the Windows critical
# temperature, 70 C (no Android phone of this SoC generation shuts down on a
# skin sensor below that: the Xperia Z1 at 85 C on a board thermistor, the
# others on the die only).

[SKIN-CPU]
algo_type        monitor
sensor           pa_therm1
sampling         1000
thresholds       59000 60000 61000 62000 70000
thresholds_clr   57000 59000 60000 61000 65000
actions          cpu cpu cpu cpu shutdown
action_info      1728000 1497600 1267200 1190400 0

[SKIN-GPU]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       62000
thresholds_clr   60000
actions          gpu
action_info      320000000

# Camera (\_SB.CESP): level 1 halves the preview and video frame rate, also
# in the middle of a recording.

[SKIN-CAMERA]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       62000
thresholds_clr   60000
actions          camera+camcorder
action_info      1+1

[CPU0_MONITOR]
algo_type        monitor
sensor           cpu0
sampling         1000
thresholds       120000
thresholds_clr   110000
actions          shutdown
action_info      0

[CPU1_MONITOR]
algo_type        monitor
sensor           cpu1
sampling         1000
thresholds       120000
thresholds_clr   110000
actions          shutdown
action_info      0

[CPU2_MONITOR]
algo_type        monitor
sensor           cpu2
sampling         1000
thresholds       120000
thresholds_clr   110000
actions          shutdown
action_info      0

[CPU3_MONITOR]
algo_type        monitor
sensor           cpu3
sampling         1000
thresholds       120000
thresholds_clr   110000
actions          shutdown
action_info      0

