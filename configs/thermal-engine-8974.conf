# Thermal-engine configuration of the Lumia 1520 (bandit), for the MSM8974
# thermal-engine blob of msm8974-common (TheMuppets, oppo).
#
# The msm8974-common (OnePlus One) file, with the core set point of the
# SS-CPU0..3 sections raised from 75 C to 85 C, as on the LG G2 and G3
# (the blob default is 90 C, kept by the Nexus 5, the Moto X 2014 and the
# Galaxy Note 3, which has no skin rule either). On the Lumia 930, with
# the same blob, the same camera stack and the same 75 C, the camera
# heated the whole SoC whatever the CPU frequency: the step-wise sections
# kept removing steps without cooling anything and fell to 300 MHz, so
# the camera dropped frames. At 85 C ten minutes of 1080p30 preview ran
# without any CPU limit (930, 24/11/2026). The 1520 has no skin rule yet:
# its skin thermistor is not exposed to the blob.

sampling         5000

[SS-CPU0]
#algo_type       ss
sampling         100
sensor           cpu0
device           cpu
set_point        85000
set_point_clr    60000
override         15000

[SS-CPU1]
#algo_type       ss
sampling         100
sensor           cpu1
device           cpu
set_point        85000
set_point_clr    60000
override         15000

[SS-CPU2]
#algo_type       ss
sampling         100
sensor           cpu2
device           cpu
set_point        85000
set_point_clr    60000
override         15000

[SS-CPU3]
#algo_type       ss
sampling         100
sensor           cpu3
device           cpu
set_point        85000
set_point_clr    60000
override         15000

[SS-GPU]
#algo_type       ss
sampling         250
sensor           tsens_tz_sensor10
device           gpu
set_point        85000
set_point_clr    55000
override         15000

[SS-POPMEM]
#algo_type       ss
sampling         10
sensor           pop_mem
device           cpu
set_point        80000
set_point_clr    55000
override         15000
time_constant    16

[GPU_MONITOR]    
algo_type        monitor
sensor           tsens_tz_sensor10
sampling         1000
thresholds       75000
thresholds_clr   55000
actions          battery
action_info      1

[CPU0_MONITOR]
algo_type        monitor
sensor           cpu0
sampling         1000
thresholds       120000
thresholds_clr   110000
actions          shutdown
action_info      0

[CPU1_MONITOR]
algo_type        monitor
sensor           cpu1
sampling         1000
thresholds       120000
thresholds_clr   110000
actions          shutdown
action_info      0

[CPU2_MONITOR]
algo_type        monitor
sensor           cpu2
sampling         1000
thresholds       120000
thresholds_clr   110000
actions          shutdown
action_info      0

[CPU3_MONITOR]
algo_type        monitor
sensor           cpu3
sampling         1000
thresholds       120000
thresholds_clr   110000
actions          shutdown
action_info      0

